server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The calculator API. The browser only ever talks to this origin.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Built assets have content hashes in their names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else is the single-page app; index.html must always be revalidated.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
